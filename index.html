<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SneakerOps: pending orders dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f4fa;--card:#fff;--ink:#15171f;--mute:#6b7280;--line:#e6e8f0;--pri:#5b4ef0;--pri2:#ede9ff;--soft:#f6f6fb;--good:#15803d;--goodb:#e3f7ea;--bad:#e11d48;--badb:#fde7ec;--warn:#b45309;--warnb:#fff1dc;--deep:#9f1239;--deepb:#fbdde6;--c1:#e3b341;--c2:#f08a24;--c3:#e5484d;--c4:#8e1b3a;--shadow:0 1px 2px rgba(20,20,60,.04),0 8px 24px rgba(20,20,60,.05);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#171a23;--ink:#eceef5;--mute:#9aa3b5;--line:#272b38;--pri:#8b80ff;--pri2:#232048;--soft:#1d212c;--good:#4ade80;--goodb:#12301f;--bad:#fb7185;--badb:#3a1620;--warn:#fbbf24;--warnb:#33270f;--deep:#fda4af;--deepb:#41192a;--c1:#e3c35f;--c2:#f5a14d;--c3:#ff7b72;--c4:#ff9aa8;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#171a23;--ink:#eceef5;--mute:#9aa3b5;--line:#272b38;--pri:#8b80ff;--pri2:#232048;--soft:#1d212c;--good:#4ade80;--goodb:#12301f;--bad:#fb7185;--badb:#3a1620;--warn:#fbbf24;--warnb:#33270f;--deep:#fda4af;--deepb:#41192a;--c1:#e3c35f;--c2:#f5a14d;--c3:#ff7b72;--c4:#ff9aa8;--shadow:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500}
.nav a i{font-style:normal;width:18px;text-align:center}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--soft);color:var(--ink);font-weight:600}
.nav a.on i{color:var(--pri)}
.nav .badge{margin-left:auto;background:var(--badb);color:var(--bad);border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600}
.syncbox{margin-top:auto;background:var(--soft);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.syncbox .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.syncbox .row b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--warn)}
.dot.live{background:var(--good)}.dot.err{background:var(--bad)}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 26px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.crumb{font-weight:600;margin-right:auto}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);width:min(340px,38vw)}
.search input{border:0;background:none;padding:9px 0;width:100%;outline:none}
.btn,.chip-btn,.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.soft{background:var(--soft);border-color:transparent}
.btn[disabled]{opacity:.6;cursor:progress}
.icon-btn{padding:9px 12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
#page{padding:26px;max-width:1320px}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warnb);color:var(--warn)}.banner.bad{background:var(--badb);color:var(--bad)}.banner.good{background:var(--goodb);color:var(--good)}
.banner b{font-weight:600}
.hello{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.hello h1{margin:0;font-size:26px;letter-spacing:-.02em}
.hello p{margin:2px 0 0;color:var(--mute)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.k-h{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:500;margin-bottom:10px}
.k-b{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.k-b b{font-size:26px;letter-spacing:-.02em}
.pill{border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-block}
.good{background:var(--goodb);color:var(--good)}.bad{background:var(--badb);color:var(--bad)}.warn{background:var(--warnb);color:var(--warn)}.deep{background:var(--deepb);color:var(--deep)}.info{background:var(--pri2);color:var(--pri)}
.g3{display:grid;gap:14px;margin-bottom:14px}
.r1{grid-template-columns:1.6fr 1fr 1fr}.r2{grid-template-columns:1fr 1.2fr 1fr}
.card h2{margin:0;font-size:16px}
.sub{color:var(--mute);font-size:13px;margin:2px 0 10px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.link{color:var(--pri);font-weight:600;text-decoration:none;background:none;border:0;padding:0}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:5px 11px;color:var(--mute);font-weight:600;font-size:13px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .n{margin-left:6px;font-size:11px;background:var(--pri2);color:var(--pri);border-radius:6px;padding:0 5px}
svg{display:block;width:100%;height:auto}
.axis{fill:var(--mute);font-size:11px}
[data-tip]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.legend span{cursor:pointer}
.legend span:hover{color:var(--ink)}
.donutwrap{display:grid;place-items:center;position:relative}
.donutc{position:absolute;text-align:center;pointer-events:none;max-width:110px}
.donutc b{display:block;font-size:22px}.donutc small{color:var(--mute);font-size:11px}
.sheet-card{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;border:0}
.sheet-card .t{font-weight:600;font-size:13px}
.sheet-card .big{font-size:22px;font-weight:700;margin:2px 0}
.sheet-card .m{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
.prog{height:6px;border-radius:6px;background:var(--line);margin:6px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);border-radius:6px}
.hb{display:grid;grid-template-columns:minmax(90px,36%) 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;font-size:13px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.hb:hover{background:var(--soft)}
.hb .t{height:14px;background:var(--soft);border-radius:6px;overflow:hidden}.hb .t i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb em{font-style:normal;font-weight:600;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--mute);font-weight:500;text-align:left;padding:8px 10px;background:var(--soft);white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
th.s{cursor:pointer}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border:0}
td small{display:block;color:var(--mute)}
.num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.note{color:var(--mute);font-size:12px;max-width:34ch}
.ins{display:flex;gap:10px;background:var(--soft);border-radius:14px;padding:12px;margin-bottom:10px}
.ins span{font-size:18px}.ins b{display:block;font-size:13px}.ins small{color:var(--mute);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600}
.field input[type=text],.field input[type=password],.field select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.field small{color:var(--mute)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--soft);border-radius:12px;margin-bottom:8px}
.chk input{margin-top:3px}
.steps{margin:0;padding-left:18px;color:var(--mute)}.steps li{margin:6px 0}.steps b{color:var(--ink)}
code{background:var(--soft);border-radius:6px;padding:1px 6px;font-size:12px}
.foot{margin-top:16px;color:var(--mute);font-size:12px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;display:none;max-width:260px}
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 26px;background:var(--card);border-bottom:1px solid var(--line)}
.fbar .lbl{font-weight:600}
.fbar label{display:flex;align-items:center;gap:6px;color:var(--mute)}
.fbar select,.fbar input[type=date]{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card);color:var(--ink)}
.fbar .cnt{margin-left:auto;color:var(--mute);font-size:13px}
.big-search{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin-bottom:12px}
mark{background:#ffe08a;color:#15171f;border-radius:3px;padding:0 1px}
.tbl-search{padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);min-width:220px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;display:none}
.empty{padding:24px;text-align:center;color:var(--mute)}
@media (max-width:1100px){.r1,.r2{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.fbar{padding:10px 14px}.fbar .cnt{margin-left:0;width:100%}.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 14px;overflow-x:auto}.nav{flex-direction:row}.syncbox{display:none}.r1,.r2{grid-template-columns:1fr}#page{padding:16px}.top{padding:10px 14px;flex-wrap:wrap}.search{width:100%;order:9}}
</style>
</head>

</div>

}

  $("crumb").textContent = { overview: "Overview", search: "Search", orders: "Pending orders", sheets: "Sheets", checks: "Data checks", settings: "Settings" }[st.view];
  var f = { overview: pgOverview, search: pgSearch, orders: pgOrders, sheets: pgSheets, checks: pgChecks, settings: pgSettings }[st.view];
  var ae = document.activeElement, aid = ae && ae.id;

  catch (e) { if (window.console) console.error(e); html = '<div class="card"><h2>Something went wrong showing this page</h2><p class="sub">' + esc(e && e.message || e) + '</p><button class="btn pri" type="button" data-act="reload">Reload</button></div>'; }
  $("page").innerHTML = html;

  try { fb.innerHTML = fbarHtml(); } catch (e2) { fb.innerHTML = ""; }

  applyTheme();
  updateStatus();
  if (aid && /^(fm|ff|ft)$/.test(aid) && $(aid) && $(aid).focus) $(aid).focus();

function go(v) { st.view = v; st.limit = 100; render(); if (location.hash !== "#" + v) location.hash = "#" + v; }
function route() {
  var h = (location.hash || "#overview").slice(1), v = { overview: 1, search: 1, orders: 1, sheets: 1, checks: 1, settings: 1 }[h] ? h : "overview";
  if (v === st.view && st.rendered) return;
  st.view = v; st.limit = 100; render();
}

document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest("[data-act],[data-go],[data-sheet],[data-band],[data-k],[data-trend],[data-chk],[data-th],[data-scope],.js-sync") : null;
  if (!t) return;
  if (t.hasAttribute("data-th")) { cfg.theme = t.getAttribute("data-th"); saveCfg(); applyTheme(); return; }
  if (t.hasAttribute("data-scope")) { st.scope = t.getAttribute("data-scope"); render(); var sq0 = $("sq"); if (sq0 && sq0.focus) sq0.focus(); return; }
  if (t.classList.contains("js-sync")) { sync(true); return; }
  if (t.hasAttribute("data-trend")) { st.trend = t.getAttribute("data-trend"); render(); return; }
  if (t.hasAttribute("data-chk")) { st.chk = t.getAttribute("data-chk"); st.limit = 100; render(); return; }
  if (t.hasAttribute("data-k")) { var k = t.getAttribute("data-k"); if (st.sk === k) st.asc = !st.asc; else { st.sk = k; st.asc = false; } render(); return; }
  var act = t.getAttribute("data-act");
  if (act === "more") { st.limit += 100; render(); return; }
  if (act === "reload") { location.reload(); return; }
  if (act === "fclear") { st.month = "all"; st.from = ""; st.to = ""; render(); return; }
  if (act === "csv") { csv(); return; }
  if (act === "copy") { (navigator.clipboard ? navigator.clipboard.writeText(chaseText()) : Promise.reject()).then(function () { toast("Chase list copied"); }, function () { toast("Copy is not allowed here"); }); return; }
  if (act === "save") {
    cfg.key = ($("key").value || "").trim(); cfg.interval = +$("iv").value || DEFAULT_INTERVAL; cfg.extras = $("ex").checked; saveCfg();
    st.sheet = "all"; st.band = "all"; toast("Saved"); go("overview"); sync(true); return;
  }
  if (act === "clear") { cfg.key = ""; saveCfg(); useSnapshot(""); toast("Using the snapshot"); render(); return; }
  if (t.hasAttribute("data-sheet")) { var s = t.getAttribute("data-sheet"); st.sheet = (st.sheet === s && st.view === "orders" && !t.hasAttribute("data-go")) ? "all" : s; st.band = t.hasAttribute("data-band") ? t.getAttribute("data-band") : "all"; st.limit = 100; if (st.view !== "orders") { go("orders"); return; } render(); return; }
  if (t.hasAttribute("data-band")) { var b = t.getAttribute("data-band"); st.band = String(st.band) === b && st.view === "orders" ? "all" : b; if (st.view !== "orders") st.sheet = "all"; st.limit = 100; if (st.view !== "orders") { go("orders"); return; } render(); return; }
  if (t.hasAttribute("data-go")) { go(t.getAttribute("data-go")); }
});
document.addEventListener("mousemove", function (e) {

});
$("gq").addEventListener("input", function (e) {
  var v = e.target.value;
  if (!v) return;
  st.sq = v; e.target.value = ""; go("search");
  var f = $("sq"); if (f && f.focus) { f.focus(); if (f.setSelectionRange) f.setSelectionRange(v.length, v.length); }
});
document.addEventListener("input", function (e) {
  var id = e.target && e.target.id;
  if (id === "sq") { st.sq = e.target.value; $("sres").innerHTML = searchResultsHtml(); }
  else if (id === "oq") { st.q = e.target.value; st.limit = 100; var L = filtered(); $("tbl").innerHTML = tableHtml(L, true, st.limit); $("cnt").textContent = count(L) + " lines, " + inr(sum(L, function (r) { return r.cur === "INR" ? r.amount : 0; })) + " at order price"; }
});
document.addEventListener("change", function (e) {
  var id = e.target && e.target.id;
  if (id === "fm") { st.month = e.target.value; st.from = ""; st.to = ""; st.limit = 100; render(); }
  else if (id === "ff" || id === "ft") { if (id === "ff") st.from = e.target.value; else st.to = e.target.value; if (st.from && st.to && st.from > st.to) { var x = st.from; st.from = st.to; st.to = x; } st.month = "all"; st.limit = 100; render(); }
  else if (id === "sdt") { st.sdate = e.target.checked; $("sres").innerHTML = searchResultsHtml(); }
});
window.addEventListener("error", function (e) { if (window.console) console.error(e.error || e.message); toast("Something went wrong. Reload the page if it looks wrong."); });
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", function () { if (!document.hidden && cfg.key && nextAt && Date.now() > nextAt) sync(false); });
setInterval(updateStatus, 1000);

applyTheme();
useSnapshot("");
route();
schedule();
if (cfg.key) sync(false);
window.__app = { sync: sync, data: function () { return data; }, cfg: cfg, transform: transform, parseDate: parseDate, SOURCES: SOURCES, st: st, render: render, visible: visible, baseVisible: baseVisible, checks: checks, searchRows: searchRows, applyTheme: applyTheme };
})();
